name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 python3-pil libpng16-16

      - name: Headless gameplay tests
        run: SEEDS=40 lua5.4 tests/run.lua

      - name: Check generated art is in sync
        run: |
          python3 tools/gen_art.py
          git diff --exit-code -- source/images source/scripts/world/atlas.lua

      - name: Install Playdate SDK
        run: |
          curl -sL -o sdk.tar.gz https://download.panic.com/playdate_sdk/Linux/PlaydateSDK-latest.tar.gz
          mkdir -p "$HOME/playdate"
          tar xzf sdk.tar.gz -C "$HOME/playdate" --strip-components=1

      - name: Compile pdx
        run: make build

      # The committed bundle is what people run after a pull, so it must match
      # source/. Everything but pdxinfo's buildtime stamp is reproducible.
      - name: Check the committed bundle is in sync
        run: |
          git diff --name-only -- ZnomeKop.pdx | grep -v '^ZnomeKop.pdx/pdxinfo$' > /tmp/stale || true
          if [ -s /tmp/stale ]; then
            echo "ZnomeKop.pdx is stale, run 'make build' and commit:"
            cat /tmp/stale
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ZnomeKop.pdx
          path: ZnomeKop.pdx
